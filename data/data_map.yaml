in_progress:
  checked_at: "2026-10-08 16:35 UTC"
  rule: >-
    Counted as downloading only if a Claude Code session is running the download now (owner, 25 Sep
    2026); one waiting for approval does not count. Checked from the running processes and the files
    being written.
  scrapes:
    - dataset: infosys_atp
      what: >-
        The ATP Stats Centre's encrypted match files of 2015 to October 2021 (key statistics, MatchBeats points,
        rally analysis, Court Vision), one season at a time: 2020, 2019, 2018, 2017, 2016, 2015, then 2021
      command: for each season, ./python.sh -m src.ingest.point_sources.infosys_atp --years <season> --max-requests 6000
      started: "2026-10-08 15:33 UTC"
      progress: >-
        At 16:35 UTC: 2020 done (files for its last four events only: Vienna, Paris, Sofia and the ATP Finals);
        2019 done (only the Next Gen and ATP Finals); 2018 under way, with no files in its first 37 events.
        No request has failed.
      expected_done: >-
        Seasons without files take about 20-30 minutes, so 2015-2018 should end within a few hours of the start;
        2021, last in the loop, holds most of the files and takes longest. Probably 9 Oct 2026
      after: Kept encrypted on the owner's instruction ("DO NOT DECRYPT IT"), so the map counts it as locked, not held.
  not_counted:
    - The daily scheduled downloads (Windows task; Tennis My Life every day, a source watch on Mondays) run once a day and were not running at the check.
    - The WTA batches B1-B9 and TDI's sweep, running on 25 Sep, have finished and are on disk.

gaps:
  - id: itf_detail
    title: ITF matches of 2018-2024 with only a result
    select: {tours: [M, W], levels: [ITF], years: [2018, 2019, 2020, 2021, 2022, 2023, 2024], below: stats}
    why: >-
      No file on disk has box scores for ITF matches before 2025, or points outside the June 2026 sample
      and the ten careers.
    could_come_from: >-
      SofaScore: a box score for 82 and every point for 78 of 84 sampled matches (about 196,600 and 186,600 of the
      gap). TennisLive: a box score for 81 of 84, points without the set-closing games. Both adapters exist; SofaScore
      needs a by-tournament listing mode (about 420,000 requests, six days in the Chrome-tab mode).
    lead: docs/research/gap-sources/README.md
  - id: challenger_points_2018_2021
    title: Challenger point by point, 2018-2021
    select: {tours: [M], levels: [CH, CHQ], years: [2018, 2019, 2020, 2021], below: point}
    why: The Infosys copy starts in mid-2021 and marks only aces and double faults at Challengers; nothing else on disk reaches them.
    could_come_from: >-
      TennisLive (points on 98% of the ten careers' Challenger matches of 2012-2021, without the set-closing games) and
      SofaScore (33% in 2012-18, 74% in 2019-21 for the same careers).
    lead: docs/studies/point_shot_sources/README.md
  - id: challenger_points_2025
    title: Challenger point by point, 2025 to June 2026
    select: {tours: [M], levels: [CH, CHQ], years: [2025, 2026], below: point}
    why: The Infosys copy ends with 2024, and TDI lists only its last ~92 days (from late June 2026).
    could_come_from: >-
      SofaScore: every point for 31 and a box score for 32 of 32 sampled matches (about 14,000). TennisLive: points
      on 32 of 32, mostly without the set-closing games. The ATP's own Stats Centre files exist for Challengers too
      (encrypted; decryption approved on 8 Oct 2026).
    lead: docs/research/gap-sources/README.md
  - id: atp_points_2018_2020
    title: ATP tour-level and qualifying point by point, 2018-2020
    select: {tours: [M], levels: [FIN, T1000, T500, T250, TQ], years: [2018, 2019, 2020], below: point}
    why: >-
      The Infosys copy starts in 2021; the SofaScore copy on disk (marcosjn2) holds most main-draw matches but little
      qualifying.
    could_come_from: >-
      SofaScore itself; TennisLive for qualifying. The ATP Stats Centre files, downloading now (kept encrypted on
      the owner's instruction), cover only the end of this span: the host has files from Vienna 2020 (late October)
      and for the 2019 Finals, none so far for the other events of 2018-2020.
    lead: docs/studies/serve_speed_acquisition/README.md
  - id: itf_after_june_2026
    title: ITF results after June 2026 (men) and after early September (women)
    select: {tours: [M, W], levels: [ITF, ITFQ], years: [2026], missing: true}
    why: >-
      Sackmann's mirror stops on 1-2 June 2026; the WTA website records on disk (version of 24 Sep) reach early September
      for women. Nothing on disk lists men's ITF results since June.
    could_come_from: >-
      TennisLive lists every sampled ITF event with results and statistics, qualifying included (one request lists an
      event); the WTA API's player-matches endpoint for women; Polymarket's settled markets (on disk) name the winners of
      about 91% of men's and 95% of women's main-draw matches; the ITF's own live-data API holds the last 14 days.
    lead: docs/research/gap-sources/README.md
  - id: men_itf_qualifying
    title: Men's ITF qualifying, every year
    select: {tours: [M], levels: [ITFQ], years: [2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026], missing: true}
    why: No file on disk lists men's ITF qualifying, so the map cannot even count it.
    could_come_from: >-
      TennisLive lists it (318 matches in 8 events of July-September 2026, all with results); the ITF's live-data API
      from now on; Polymarket names qualifying winners from 27 Jul 2026.
    lead: docs/research/gap-sources/README.md
  - id: wta_2018_points
    title: WTA point by point in 2018
    select: {tours: [W], levels: [FIN, T1000, T500, T250, TQ, CH, CHQ], years: [2018], below: point}
    why: The WTA API's point log is empty for 2018; the SofaScore copy on disk (marcosjn2) holds most main draws but no qualifying.
    could_come_from: >-
      SofaScore itself (every point for 19 of 22 sampled main-draw matches) and TennisLive (points on 32 of 32,
      qualifying included, without the set-closing games).
    lead: docs/research/gap-sources/README.md
  - id: women_shots
    title: Shot-by-shot data for women's matches
    select: {tours: [W], levels: [GS, FIN, T1000, T500, T250], years: [2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026], below: shot}
    why: >-
      Only volunteer charts and the Hawk-Eye copy of the Australian Open and Roland Garros (to 2024) reach women's
      matches; the WTA serves no tracking.
    could_come_from: >-
      2,061 women's charts that exist only on tennisabstract.com (1,467 of them in the Hugging Face copy
      ramizheman/TennisNLData, 594 pages to parse). About 15,000 women's matches have no public shot source at all.
    lead: docs/research/gap-sources/README.md

universe:
  explain: >-
    What exists outside data/: sources measured (or, where marked, inferred) to hold the map's matches at a finer level
    than its files do. Shares are of all the matches in the rows and years named, from the gap-sources samples of 29 Sep
    2026 unless noted. "Exists publicly" on the map adds every route except paid ones. A source marked `disjoint` holds
    only matches the map has nothing at its level for, so its matches add to ours instead of overlapping them.
  routes:
    - {id: collect_now, name: "Public, not collected yet", explain: "Served publicly; collectable under the owner's decision of 8 Oct 2026; an adapter exists or nearly does."}
    - {id: on_disk_locked, name: "On disk but encrypted", explain: "Downloaded, but kept encrypted on the owner's instruction, so unreadable for now."}
    - {id: forward_only, name: "From now on only", explain: "Served only for recent days: it can be captured from now on, not for past matches."}
    - {id: paid, name: "Paid or licensed", explain: "Sold by a vendor; claims not checked, nothing bought. Not counted in 'exists publicly'."}
  sources:
    - id: sofascore_itf
      source: SofaScore, ITF 2018-2024
      route: collect_now
      select: {tours: [M, W], levels: [ITF], years: [2018, 2019, 2020, 2021, 2022, 2023, 2024]}
      shares: {point: 0.93, stats: 0.98}
      evidence: "84 sampled ITF matches of 2018-2024: box score 82, every point 78"
      effort: About 420,000 requests; six days in the Chrome-tab mode
      lead: docs/research/gap-sources/README.md
    - id: tennislive_itf
      source: TennisLive.net, ITF 2019-2026
      route: collect_now
      select: {tours: [M, W], levels: [ITF, ITFQ], years: [2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]}
      shares: {result: 1.0, stats: 0.96, point: 0.9}
      evidence: "81 of 84 sampled 2018-24 matches with a box score and points (set-closing games missing); every sampled event after June 2026 listed in full with results"
      effort: About 210,000 page requests for 2018-24; one request lists an event
      lead: docs/research/gap-sources/README.md
    - id: sofascore_challenger
      source: SofaScore, Challengers 2024 to June 2026
      route: collect_now
      select: {tours: [M], levels: [CH, CHQ], years: [2024, 2025, 2026]}
