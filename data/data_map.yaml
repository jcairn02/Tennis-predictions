      data/dump/points/infosys_atp/, which the serve-speed history reads: its own raw folder and tables, and a staging
      guard that refuses the 2015-2021 backfill's folder and any year before 2022. Checks
      (data/studies/serve_speed_acquisition/infosys_atp_recent_checks.json): the same players as ManTennisData on
      25,010 of 25,012, the same winner 24,225 of 24,225; SirGenkii's copy (894 matches, Jan-Apr 2025) equal point for
      point. Not in the leak-proof match clock. Newer MatchBeats format (the owner's decision of 27 Oct 2026): fetched
      27-28 Oct for 17,899 of the 17,905 older-format matches (6 "server error"), so 24,997 of the 25,003 matches with
      every point carry its 8 extra point fields and game momentum beside the older copy's core; the two copies' endings
      differ on 3.8% of points, and both are kept (result, result_newer). Restaged on 28 Oct on ManTennisData's copy of
      26 Oct (25,609 planned codes), which adds the key statistics of 85 matches of 19-27 Oct already in the daily
      collector's folder.

