      every trade print. Read over HTTP range requests on 6 Oct 2026 (32 GB read). The archive runs from
      13 Apr to 10 Aug 2026 and holds about 75% of tennis markets, with long gaps (12-29 Jun, 10-14 Jul).
    grain: market
    tours: [men, women]
    levels: [T1000, T500, T250, TQ, CH, ITF]
