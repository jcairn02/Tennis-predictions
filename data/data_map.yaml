      (marcosjn2) lacks (446, also in atp_points_2018_2020), WTA matches of 2019 (288, 102 of them before the WTA's
      point log starts on 1 April), the Tokyo, Beijing and Seoul events of late September 2026, and scattered
      others.
    could_come_from: >-
      SofaScore (every point for 34 of 36 sampled ATP 2025 and 19 of 22 WTA 2018 main-draw matches).
    lead: docs/studies/gap_downloads/collection-plan.md
  - id: itf_after_june_2026
    title: ITF results after June 2026 (men) and after early September (women)
    select: {tours: [M, W], levels: [ITF, ITFQ], years: [2026], missing: true}
    why: >-
      Sackmann's mirror stops on 1-2 June 2026; the WTA website records on disk (version of 24 Sep) reach early September
      for women. Filled on 9 Oct 2026, through 4 Oct 2026, by TennisLive's event listings (work package P4): every ITF
      event, qualifying included, with its results.
    could_come_from: >-
      TennisLive's listings (on disk); the ITF's own live-data API keeps the last 14 days current, daily; the WTA API's
      player-matches endpoint for women; Polymarket's settled markets (on disk) name the winners of about 91% of men's
      and 95% of women's main-draw matches.
    lead: docs/research/gap-sources/README.md
  - id: men_itf_qualifying
    title: Men's ITF qualifying, every year
    select: {tours: [M], levels: [ITFQ], years: [2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026], missing: true}
    why: >-
      No result file lists men's ITF qualifying. Filled on 9 Oct 2026 by TennisLive's event listings (work package P4),
      every year to 4 Oct 2026, results only; the map has no estimate of what any source still misses.
    could_come_from: >-
      TennisLive's listings (on disk); the ITF's live-data API from now on; Polymarket names qualifying winners from
      27 Jul 2026.
    lead: docs/research/gap-sources/README.md
  - id: wta_2018_points
    title: WTA point by point in 2018
    select: {tours: [W], levels: [FIN, T1000, T500, T250, TQ, CH, CHQ], years: [2018], below: point}
    why: The WTA API's point log is empty for 2018; the SofaScore copy on disk (marcosjn2) holds most main draws but no qualifying.
    could_come_from: >-
      SofaScore itself (every point for 19 of 22 sampled main-draw matches) and TennisLive (points on 32 of 32,
      qualifying included, without the set-closing games).
    lead: docs/research/gap-sources/README.md
  - id: wta125_points_2019_2026
    title: WTA 125 point by point, 2019-2026
    select: {tours: [W], levels: [CH, CHQ], years: [2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026], below: point}
    why: >-
      The WTA API's point log misses these 377 matches (8 Oct 2026): 147 of January-March 2019, before it starts on
      1 April 2019, and most of the rest from events of 2025-2026.
    could_come_from: SofaScore (listed under its WTA 125 category).
    lead: docs/studies/gap_downloads/collection-plan.md
  - id: qualifying_points_2018_2026
    title: Tour-level and Grand Slam qualifying point by point, 2018-2026
    select: {tours: [M, W], levels: [TQ, GSQ], years: [2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026], below: point}
    why: >-
      The qualifying matches no point source on disk reaches: 6,482 on the map of 9 Oct 2026 (03:56 UTC), 5,546 of them
      in 2018-2021. The SofaScore copy on disk (marcosjn2) holds little qualifying, and SofaScore had none of 10 sampled
      WTA 2018 qualifying matches. TennisLive's pages (work package P5, 10 Oct 2026) gave 6,261 of them points; 221 were
      left on the map of 10 Oct, 21:13 UTC (pages without points, and matches not linked).
    could_come_from: >-
      TennisLive (points on 8 of 10 of the ten careers' tour qualifying matches of 2012-18 and on 10 of 10 sampled WTA
      2018 qualifying matches, without the set-closing games).
    lead: docs/studies/gap_downloads/collection-plan.md
  - id: women_shots
    title: Shot-by-shot data for women's matches
    select: {tours: [W], levels: [GS, FIN, T1000, T500, T250], years: [2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026], below: shot}
    why: >-
      Only volunteer charts and the Hawk-Eye copy of the Australian Open and Roland Garros (to 2024) reach women's
      matches; the WTA serves no tracking.
    could_come_from: >-
      2,061 women's charts that exist only on tennisabstract.com (1,467 of them in the Hugging Face copy
      ramizheman/TennisNLData, 594 pages to parse). About 15,000 women's matches have no public shot source at all.
    lead: docs/research/gap-sources/README.md

universe:
  explain: >-
    What exists outside data/: sources measured (or, where marked, inferred) to hold the map's matches at a finer level
    than its files do. Shares are of all the matches in the rows and years named, from the gap-sources samples of 29 Sep
    2026 unless noted. "Exists publicly" on the map adds every route except paid ones. A source marked `disjoint` holds
    only matches the map has nothing at its level for, so its matches add to ours instead of overlapping them.
  routes:
    - {id: collect_now, name: "Public, not collected yet", explain: "Served publicly; collectable under the owner's decision of 8 Oct 2026; an adapter exists or nearly does."}
    - {id: on_disk_locked, name: "On disk but encrypted", explain: "Downloaded, but kept encrypted on the owner's instruction, so unreadable for now."}
    - {id: forward_only, name: "From now on only", explain: "Served only for recent days: it can be captured from now on, not for past matches."}
    - {id: paid, name: "Paid or licensed", explain: "Sold by a vendor; claims not checked, nothing bought. Not counted in 'exists publicly'."}
  sources:
    - id: sofascore_itf
      source: SofaScore, ITF 2018-2024
      route: collect_now
      select: {tours: [M, W], levels: [ITF], years: [2018, 2019, 2020, 2021, 2022, 2023, 2024]}
      shares: {point: 0.93, stats: 0.98}
      evidence: "84 sampled ITF matches of 2018-2024: box score 82, every point 78"
      effort: About 420,000 requests; six days in the Chrome-tab mode
      lead: docs/research/gap-sources/README.md
    - id: tennislive_itf
      source: TennisLive.net, ITF 2019-2026
      route: collect_now
      select: {tours: [M, W], levels: [ITF, ITFQ], years: [2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]}
      shares: {result: 1.0, stats: 0.96, point: 0.9}
      evidence: "81 of 84 sampled 2018-24 matches with a box score and points (set-closing games missing); since June 2026, 177 of 200 sampled main-draw pages with points and 196 with statistics; qualifying 2019-26, points on 70 of 200 (43 of 62 in the final round). Every event's results are on disk since 9 Oct 2026 (tennislive_events)"
      effort: "One page per match (work package P8); TennisLive stopped answering this address on 9 Oct 2026 after about 12,200 requests in seven hours"
      lead: docs/research/gap-sources/README.md
    - id: sofascore_challenger
      source: SofaScore, Challengers 2024-2026 (collected by P6)
      route: collect_now
      select: {tours: [M], levels: [CH, CHQ], years: [2024, 2025, 2026]}
      shares: {point: 0.99, stats: 0.99}
      evidence: "measured in P6 (8-12 Oct 2026): every point for 14,601 of the 14,675 matches of the gap challenger_points_2025 (14,485 complete to the score), a box score for 14,592; every point for 1,874 of 1,877 linked 2024 matches of challenger_points_2022_2024. Before 2024 SofaScore has almost none from spring 2022 to the end of 2023, and 48% of the 2018-2021 gap"
      effort: About 30,000 requests
      lead: docs/research/gap-sources/README.md
    - id: tennislive_challenger
      source: TennisLive.net, Challengers 2018-2026
      route: collect_now
      select: {tours: [M], levels: [CH, CHQ], years: [2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]}
      shares: {point: 0.96, stats: 0.97}
      evidence: "measured on the map's 30,980 Challenger gap matches of 2018-2024 (work package P5, 10 Oct 2026): points on 29,695, statistics on 30,109 (set-closing games usually missing; on disk since 10 Oct 2026, tennislive_gaps); 32 of 32 sampled 2025-26 matches"
      effort: One page per match
      lead: docs/studies/gap_downloads/README.md
    - id: sofascore_tour
      source: SofaScore, tour level 2018-2026
      route: collect_now
      select: {tours: [M, W], levels: [GS, FIN, T1000, T500, T250], years: [2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]}
      shares: {point: 0.9, stats: 0.95}
      evidence: "inferred: 34 of 36 sampled ATP 2025 and 19 of 22 WTA 2018 main-draw matches with every point; the copy on disk (marcosjn2) is a subset. Collected for the matches other files lacked (30 Sep and 8-12 Oct 2026): ATP 2025-26, every point for 3,777 of 3,778; ATP 2018-20 main draws, 773 of 911; WTA 2018 main draws, 359 of 541; the rest of 2019-26, 1,025 of 1,216"
      effort: About 2 requests a match
      lead: docs/research/gap-sources/README.md
    - id: tennislive_qualifying
      source: TennisLive.net, tour and Slam qualifying 2018-2026
      route: collect_now
      select: {tours: [M, W], levels: [TQ, GSQ], years: [2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]}
      shares: {point: 0.97, stats: 0.98}
      evidence: "measured on the map's 6,482 qualifying gap matches (work package P5, 10 Oct 2026): points on 6,279, statistics on 6,377 (set-closing games usually missing; on disk since 10 Oct 2026, tennislive_gaps)"
      effort: One page per match
      lead: docs/studies/gap_downloads/README.md
    - id: wta_site_refresh
      source: WTA website records, refreshed (WTA API player matches)
      route: collect_now
      select: {tours: [W], levels: [ITF, ITFQ], years: [2026]}
      shares: {result: 1.0}
      evidence: "collected 11 and 13 Oct 2026 (work package P2(b), dataset wta_site_records): 4,467 players' 2026 lists, results to the ITF editions of 5 Oct; against the ITF's own data, 97%, 96% and 76% of the women's ITF singles of the weeks of 14, 21 and 28 Sep. The website lists a week's ITF results a week or two late, so later weeks need a refresh"
      effort: "The weekly job wta_site (src/ingest/scheduled.py, since 14 Oct 2026): about 2,400 requests a week; 4,437 for the first crawl"
      lead: docs/studies/gap_downloads/README.md
    - id: ta_charts_women
      source: Tennis Abstract website-only charts (women)
      route: collect_now
      select: {tours: [W], levels: [GS, FIN, T1000, T500, T250], years: [2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]}
      counts_by_year: {shot: {2018: 298, 2019: 377, 2020: 137, 2021: 219, 2022: 216, 2023: 307, 2024: 193, 2025: 183, 2026: 131}}
      disjoint: true
      evidence: "2,061 women's website-only charts of matches no file has shots for; 1,467 in the Hugging Face copy ramizheman/TennisNLData (not on disk: the copy on disk is men's), 594 pages to parse"
      effort: Hugging Face download plus 594 pages
      lead: docs/research/gap-sources/README.md
    - id: atp_statscentre_2025
      source: ATP Stats Centre files 2025-2026 (tour level and Challengers)
      route: collect_now
      select: {tours: [M], levels: [FIN, T1000, T500, T250, TQ, CH, CHQ], years: [2025, 2026]}
      shares: {point: 0.99, stats: 0.99}
      evidence: "measured in P9 (16-24 Oct 2026, dataset infosys_atp_recent): of the 25,277 tour-level and Challenger match codes ManTennisData lists to 18 Oct 2026, every point for 25,003 and key statistics for 24,995; Court Vision tracking for 4,072 (tour main draws about 60%, 2026's tracked Challengers); timed serves for 4,324. The daily collector keeps the current season's key statistics"
      effort: About 3.4 requests a match (85,639 in all), plus decryption at staging
      lead: docs/research/gap-sources/README.md
    - id: itf_live_api
      source: The ITF's live-data API (every level, qualifying, statistics, points)
      route: forward_only
      select: {tours: [M, W], levels: [ITF, ITFQ], years: [2026]}
      shares: {}
      evidence: >-
        the last 14 days only (older dates answer HTTP 422). Collected from 15 Sep 2026 and captured daily since 8 Oct
        (dataset itf_live): statistics and points on 99.2% of played main-draw singles and 40% of qualifying (the
        final qualifying round 99.8%)
      effort: The daily job (src/ingest/scheduled.py, job itf), about 450 requests a day
      lead: docs/studies/official_point_feeds/README.md
    - id: live_tennis_api_archive
      source: Live Tennis API archive (paid)
      route: paid
      select: {tours: [M, W], levels: [CH, CHQ, ITF], years: [2023, 2024, 2025, 2026]}
      shares: {}
      evidence: "vendor's claim: a point sequence for 99.6% of indexed Challenger and 99.3% of ITF men's singles; its index lists 83.5% of 2025-26 Challenger matches. $49 a month"
      effort: Purchase; storage limited by its terms
      lead: docs/studies/point_shot_sources/README.md
    - id: sportradar
      source: Sportradar Tennis API (paid)
      route: paid
      select: {tours: [M, W], levels: [T1000, T500, T250, TQ, CH, CHQ], years: [2024, 2025, 2026]}
      shares: {}
      evidence: "documented: ATP and Challenger point by point from round 1, WTA 250 and 125 from the semi-finals, in a rolling window of the current season and the two adjacent ones; no betting use"
      effort: Enterprise quote
      lead: docs/research/granular-data-leads/README.md

cell_notes:
  - {tours: [M, W], levels: all, years: [2020], note: "The tours stopped from March to August 2020 (COVID-19)."}
  - {tours: [M], levels: [CH], years: [2019], note: "In 2019 Challenger main draws grew to 48 players, so this row holds matches that would otherwise be qualifying."}
  - {tours: [M], levels: [CHQ], years: [2019, 2020, 2021], note: "Little qualifying: the 48-player Challenger draws of 2019 replaced most of it, and it came back gradually."}
  - {tours: [M], levels: [ITFQ], years: all, note: "Men's ITF qualifying comes from TennisLive's event listings (results only), every year to 4 Oct 2026."}
  - {tours: [W], levels: [ITFQ], years: all, note: "Women's ITF qualifying comes from Sackmann (2019-2024), the WTA website's records (to early September 2026) and TennisLive's event listings (every year, to 4 Oct 2026)."}
  - {tours: [W], levels: [GSQ], years: [2018, 2019, 2020], note: "The files hold women's Slam qualifying only in part for these years; the shortfall is counted from the draw sizes."}
  - {tours: [M, W], levels: [FIN], years: [2026], note: "The Finals are played in November."}
  - {tours: [W], levels: [FIN], years: [2020], note: "Cancelled (COVID-19)."}
  - {tours: [M, W], levels: [GS], years: [2018, 2019, 2020, 2021], note: "Point data from Sackmann's Slam archive, the Slams' feeds and SofaScore copies; shot data from charts and the Hawk-Eye copy of the Australian Open and Roland Garros."}
  - {tours: [M, W], levels: [GS], years: [2022, 2023, 2024], note: "Every Slam has point data: Wimbledon and the US Open from their feeds, the Australian Open and Roland Garros from SofaScore and the Hawk-Eye copy, which also tracks every stroke for many of their matches."}
  - {tours: [M, W], levels: [GS], years: [2025, 2026], note: "Point data from the Slams' feeds, the decrypted Infosys files (AO 2025, RG 2025-26) and SofaScore; shot data from charts only."}
  - {tours: [M], levels: [T1000, T500, T250, FIN, TQ], years: [2022, 2023, 2024], note: "Shot data here is Hawk-Eye ball tracking (Court Vision) plus volunteer charts."}
  - {tours: [M, W], levels: [T1000, T500, T250, FIN], years: [2018, 2019, 2020], note: "Point data mostly from the Kaggle copy of SofaScore (marcosjn2): every point's winner, with no serve or outcome codes."}
  - {tours: [M], levels: [T1000, T500, T250, FIN, TQ], years: [2025, 2026], note: "Point data from the ATP's own Stats Centre files (to 18 Oct 2026, with Hawk-Eye ball tracking for about 60% of main-draw matches), SofaScore (by tournament), SirGenkii's Infosys copy (January-April 2025) and TDI (from late June 2026)."}
  - {tours: [M], levels: [CH, CHQ], years: [2026], note: "Point data from the ATP's own Stats Centre files (nearly every match to 18 Oct 2026; Hawk-Eye ball tracking at the events that publish it) and TDI (from late June)."}
  - {tours: [M, W], levels: [ITF], years: [2026], note: "Results to 4 Oct 2026 from TennisLive's event listings (the result files stop in early June for men and early September for women); the June point data is the Live Tennis API's one-month sample."}
  - {tours: [W], levels: [FIN, T1000, T500, T250, TQ, CH, CHQ], years: [2019], note: "The WTA's point log starts on 1 April 2019; earlier logs are served empty."}

not_in_the_map:
  - Doubles and mixed doubles (held in the Slam feeds, the WTA point log, TDI, Infosys and Sackmann to 2020).
  - Junior, wheelchair, legends and exhibition matches.
  - Matches before 2018.
  - Rankings and player tables (Sackmann weekly rankings to 8 Jun 2026; TML ATP rankings of 31 Aug 2026).
  - The IBM extras at Wimbledon and the US Open (likelihood-to-win, TennisViz, limb tracking, key moments, distance run).
