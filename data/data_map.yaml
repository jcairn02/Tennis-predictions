      singles), and for the singles the opening line and the last line, each with its time, of BetOnline and
      its sister brand SportsBetting.ag (identical; listed from January 2026), in the match-winner and
      total-games markets. Of 22,854 singles played, 22,203 have BetOnline's opening and last match-winner line
      (21,469 with a clean close) and 19,805 its total games. Tour-level events and Slams with their
      qualifying; no Challenger or ITF. Pulled 7 Oct 2026 (UTC), 339 requests.
    grain: market
    tours: [men, women]
