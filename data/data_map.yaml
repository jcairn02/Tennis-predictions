# The data map: the master list of what data/ holds.
#
# One entry per dataset: what it is, the finest level of detail it reaches, the years and
# tournament levels it covers, where it sits in the pipeline, where it came from, and whether it
# is on disk, downloading now, or only assumed. The visual map, data/data_map.html, is built from
# this file together with the coverage measured from the files themselves:
#
#     ./python.sh src/eda/data_map/build.py                  # measure (about a minute) and rebuild
#     ./python.sh src/eda/data_map/build.py --no-measure     # rebuild the page from the last measurement
#
# Keep it current. When a download starts or finishes, or a batch is approved, change `status`
# here (and in `measured_as` where a dataset has several parts), then rebuild. New data gets a new
# entry; the build lists any folder under data/raw/ or data/dump/ that no entry claims.
#
# Status words:  on_disk      downloaded and on disk
#                downloading  a Claude Code session is running its download right now
#                assumed      not downloaded; counted as held on the owner's instruction
# Grain words (finest first): shot, point, stats, result. Also: market (prices and odds) and
# reference (indexes, player tables, captures that support other datasets).
# `how` names the method the data was obtained by (see `methods`). `universe` lists what exists outside
# data/ (measured where possible) so the map can set what we hold against what could be had.

as_of: 2026-10-08

statuses:
  on_disk: Downloaded and on disk.
  downloading: >-
    A Claude Code session is running this download now. Counted as held once it finishes; until then the
    map counts only what is on disk. A download that is waiting for approval does not count (owner, 25 Sep 2026).
  assumed: >-
    Not downloaded yet, but counted as held on the owner's instruction. None at present: the WTA batches B2-B9,
    assumed on 25 Sep 2026, were all downloaded by 2 Oct 2026.

methods:
  - {id: github, name: GitHub download, explain: "Files fetched from a public GitHub repository at a pinned commit and checked against its hashes."}
  - {id: hugging_face, name: Hugging Face download, explain: "A public Hugging Face dataset at a pinned commit, fetched in byte ranges and hash-checked."}
  - {id: kaggle, name: Kaggle download, explain: "A public Kaggle dataset, fetched through Kaggle's anonymous download link."}
  - {id: zenodo, name: Zenodo download, explain: "A research data deposit, checksum-verified."}
  - {id: site_files, name: Publisher's own files, explain: "The data files a publisher offers on its site, fetched from its file list."}
  - {id: wayback, name: Internet Archive, explain: "Copies the Wayback Machine kept of files or feeds the live site no longer serves."}
  - {id: api_scrape, name: Scraped from a public JSON feed, explain: "The JSON a site's own pages load (draws, scores, point histories, odds), asked one document at a time about 2 seconds apart, every answer kept with a receipt."}
  - {id: page_scrape, name: Scraped from web pages, explain: "Public pages read one at a time and the data parsed out of them."}
  - {id: browser_scrape, name: Scraped inside a Chrome tab, explain: "SofaScore refuses plain programs, so its requests ran inside a real Chrome window the owner opened."}
  - {id: decrypted, name: Encrypted files the project decrypts, explain: "Files a site serves encrypted and its own page decrypts; kept as served and decrypted when staged (owner's decisions of 7 and 8 Oct 2026)."}
  - {id: encrypted, name: Encrypted files kept encrypted, explain: "Downloaded as served and not decrypted, on the owner's instruction; unreadable until decrypted."}
  - {id: public_api, name: A market's public API, explain: "Polymarket's own public APIs for listings, prices and trades, with no account."}
  - {id: archive_reads, name: Read from a public archive, explain: "Only the tennis rows of a public archive's hourly files, read over HTTP range requests."}
  - {id: sample_reads, name: Sampled reads (research), explain: "Bounded reads to measure what a source holds; samples, not a collection."}
  - {id: project, name: The project's own records, explain: "Bookkeeping the project writes itself."}

grains:
  - id: shot
    name: Shot by shot
    short: Every stroke of every rally.
    explain: >-
      Each shot in each point: the serve and where it went, then every return and rally shot (forehand
      or backhand, direction, depth), and how the point ended. It comes from volunteers charting video
      (the Match Charting Project) or from Hawk-Eye cameras tracking the ball (Court Vision).
    example: "Serve wide, forehand return crosscourt, backhand down the line, forehand winner: 4f2b3f1*"
  - id: point
    name: Point by point
    short: Every point in order, with who won it.
    explain: >-
      The score after every point, who served, and who won the point. The richer feeds add whether it
      was a first or second serve, how the point ended (ace, double fault, winner, error), serve speed,
      rally length and a clock time.
    example: "Game 3: 15-0, 30-0, 30-15, 40-15, game (server holds; ace on the last point)"
  - id: stats
    name: Game-level stats and totals
    short: Match or set totals.
    explain: >-
      A box score: aces, double faults, first serves in, points won on first and second serve, break
      points faced and saved, service games. It says how a match went in total, not in what order.
    example: "Aces 12 v 4; double faults 3 v 5; first serves in 64% v 58%; break points saved 4/5 v 2/6"
  - id: result
    name: Result and score
    short: Who won, and the score.
    explain: >-
      The winner, the loser and the set scores. Every match in the map has at least this, apart from the
      matches marked missing.
    example: "Sinner d. Alcaraz 6-4 3-6 7-6(5)"

levels:
  - {code: GS, name: Grand Slams, short: "main draw of the 4 majors", explain: "The four majors: Australian Open, Roland Garros, Wimbledon, US Open. 127 singles matches per tour at each."}
  - {code: GSQ, name: Slam qualifying, short: "the week before each Slam", explain: "Three rounds the week before a Slam that decide the last 16 places in the draw. 112 matches per tour at each."}
  - {code: FIN, name: Tour Finals, short: "season finales", explain: "Season-ending events for the top eight: ATP Finals, WTA Finals, plus the Next Gen ATP Finals and the WTA Elite Trophy."}
  - {code: T1000, name: 1000s, short: "Masters 1000 / WTA 1000", explain: "The biggest events after the Slams (Indian Wells, Miami, Madrid, Rome, Canada, Cincinnati, Shanghai, Paris ...). Before 2021 the WTA called them Premier Mandatory and Premier 5."}
  - {code: T500, name: 500s, short: "ATP 500 / WTA 500", explain: "The middle tier of the main tours (WTA Premier before 2021)."}
  - {code: T250, name: 250s, short: "ATP 250 / WTA 250", explain: "The entry tier of the main tours (WTA International before 2021)."}
  - {code: TEAM, name: Team events, short: "Davis Cup, BJK Cup, United Cup, Olympics", explain: "Davis Cup, Billie Jean King Cup, ATP Cup, United Cup, Laver Cup and the Olympics."}
  - {code: TQ, name: Tour qualifying, short: "at the 1000s, 500s and 250s", explain: "Qualifying rounds at the 1000, 500 and 250 events."}
  - {code: CH, name: Challenger / WTA 125, short: "second tier, main draw", explain: "The second tier, where most players ranked about 80-300 play. Since 2019 men's Challenger main draws have up to 48 players, so qualifying shrank."}
  - {code: CHQ, name: Challenger qualifying, short: "and WTA 125 qualifying", explain: "Qualifying rounds at Challenger and WTA 125 events."}
  - {code: ITF, name: ITF World Tour, short: "entry level, main draw", explain: "The entry level of pro tennis (men's M15/M25, women's W15-W100): about 17,000 singles matches a year per tour."}
  - {code: ITFQ, name: ITF qualifying, short: "entry level, qualifying", no_source: [M], explain: "Qualifying at ITF events. No source lists men's ITF qualifying; the women's is listed by Sackmann for 2019-2024."}

pipeline:
  - stage: raw
    path: data/raw/
    what: >-
      Every file exactly as downloaded, never edited, with a receipt for each fetch (_receipts.jsonl:
      URL, time, status, bytes, SHA-256). Gitignored. LARGE_FILES.md says how to get the big files back.
    made_by: src/ingest/ (one adapter per source)
  - stage: staged
    path: data/dump/
    what: >-
      The raw files as tables: Parquet, every column kept as a string, plus provenance columns, in one
      branch per kind of data (matches, points, players, rankings, odds). Rebuilt from raw by the same
      adapters. Gitignored.
    made_by: src/ingest/ (the same adapters, with --stage-only)
  - stage: evidence
    path: data/studies/
    what: >-
      One folder per study: small tracked files that say what the data holds and how it was checked (manifests,
      run summaries, coverage tables, check results), beside the studies' own outputs (features, model fits),
      which make up most of its size and are mostly gitignored. The write-ups are in docs/studies/.
    made_by: src/eda/<study>/
  - stage: merged
    path: null
    what: >-
      Not built yet. One cleaned database joining the sources (players, tournaments, matches, points,
      odds, markets), as proposed in docs/studies/public_data_dump/structure-plan.md.
    made_by: null
  - stage: predictions and bets
    path: predictions/, data/betting_history/
    what: Reserved homes for forecasts and for actual bets and their settlement. Empty.
    made_by: null

datasets:

  # ---------------------------------------------------------------- results and totals
  - id: tennis_my_life
    name: Tennis My Life
    provider: Tennis My Life (tennismylife.org), a public site that rebuilds Sackmann's format from official results
    what: >-
      Season files of ATP main-tour, Challenger (main draw), ATP qualifying and WTA main-tour singles,
      with serve and return totals, plus files for tournaments in progress, an ATP player table and a
      ranking snapshot. The freshest result source: to the week of 21 Sep 2026.
    grain: stats
    tours: [men, women]
    levels: [GS, GSQ, FIN, T1000, T500, T250, TEAM, TQ, CH]
    years: 2000-2026 (to 21 Sep 2026)
    status: on_disk
    how: site_files
    measured_as: [tml]
    raw: [data/raw/public_dump/tennis_my_life/]
    staged: [data/dump/matches/tennis_my_life/, data/dump/players/tennis_my_life/, data/dump/rankings/tennis_my_life/]
    adapter: src/ingest/public_dump/tennis_my_life.py
    evidence: data/studies/public_data_dump/
    report: docs/studies/public_data_dump/README.md
    rights: MIT on the site, noncommercial in its repository (they conflict; both recorded by data_continuity/canary.py)
    backup: >-
      The publisher revises files in place (a 2024 score on 5 Oct 2026), and its GitHub copy stopped in January
      2026. From 6 Oct 2026 the adapter keeps every replaced file under superseded/ with its receipts, holds a
      damaged or shrunken download under held/ instead of making it current, and logs accepted revisions in
      _changes.jsonl (docs/decisions/2026-10-06-tml-file-versions.md). No copy outside this PC.
    notes: >-
      Uses the ATP's own ids (tournament 2023-339, player S0AG), which is what joins it to Infosys.
      Files Winston-Salem 2026 as a Masters event and some 2024 Challenger rows under 2007 dates. Measured
      against Sackmann and the official feeds (docs/studies/data_continuity/): women's aces and double faults of
      Dec 2024 - Feb 2026 are wrong in most rows; Wimbledon 2026 men's first serves in run six points above the
      official feed; no women's qualifying, WTA 125, ITF or Challenger qualifying files.

  - id: sackmann_archive
    name: Jeff Sackmann's tennis_atp and tennis_wta
    provider: Jeff Sackmann (Tennis Abstract), via an archival GitHub mirror at commit 8373358
    what: >-
      The standard open results database: every ATP and WTA singles match from the main tours down to
      ITF (Futures), qualifying included, with serve and return totals where they exist, plus player
      tables and weekly rankings. Stops at the end of May 2026.
    grain: stats
    tours: [men, women]
    levels: [GS, GSQ, FIN, T1000, T500, T250, TEAM, TQ, CH, CHQ, ITF, ITFQ]
    years: 1968-2026 (2010+ staged; to 1-2 Jun 2026)
    status: on_disk
    how: github
    measured_as: [sackmann]
    raw: [data/raw/public_dump/sackmann_archive/atp/, data/raw/public_dump/sackmann_archive/wta/]
    staged: [data/dump/matches/sackmann_archive/, data/dump/players/sackmann_archive/, data/dump/rankings/sackmann_archive/]
    adapter: src/ingest/public_dump/sackmann_archive.py
    evidence: data/studies/public_data_dump/
    report: docs/studies/public_data_dump/README.md
    rights: CC BY-NC-SA 4.0
    notes: >-
      Sackmann's own repositories answer 404 since September 2026; this is a mirror. ITF matches carry
      no serve statistics before 2025. Women's ITF qualifying is listed for 2019-2024 only, and
      women's Slam qualifying is short in 2018-2020.

  - id: api_tennis
    name: api-tennis fixtures (Hugging Face handoff)
    provider: api-tennis.com, as scraped by the atlas-polybot pipeline and published on Hugging Face
    what: >-
      Men's ATP, Challenger and ITF fixtures of 2021-2024 with exact dates, start times, results and
      status (retired, walkover, cancelled). Adds Davis Cup group ties and some Challenger qualifying
      matches the other result files lack.
    grain: result
    tours: [men]
    levels: [T1000, T500, T250, TEAM, TQ, CH, CHQ, ITF]
    years: 2021-2024
    status: on_disk
    how: hugging_face
    measured_as: [api_tennis]
    raw: [data/raw/public_dump/atp_pipeline_handoff/api_tennis/]
    staged: null
    adapter: src/ingest/public_dump/atp_pipeline_handoff.py
    evidence: data/studies/atp_pipeline_handoff/
    report: docs/studies/atp_pipeline_handoff/README.md
    decision: docs/decisions/2026-09-25-atp-pipeline-handoff.md
    rights: No licence stated
    notes: Not staged. A few doubles matches are filed as singles; the map leaves them out.

  - id: flashscore
    name: Flashscore match pages (Hugging Face handoff)
    provider: Flashscore, as scraped by the atlas-polybot pipeline
    what: >-
      566,853 distinct matches with real start times, set durations and, for about a fifth, per-set
      statistics: ATP and Challenger singles 1990 to April 2025, plus a head-to-head crawl reaching ITF,
      WTA and junior matches to 17 April 2026.
    grain: stats
    tours: [men, women]
    levels: [GS, T1000, T500, T250, CH, ITF]
    years: 1990-April 2026
    status: on_disk
    how: hugging_face
    measured_as: []
    raw: [data/raw/public_dump/atp_pipeline_handoff/flashscore_full/, data/raw/public_dump/atp_pipeline_handoff/flashscore_gql_stats/, data/raw/public_dump/atp_pipeline_handoff/flashscore_daily/, data/raw/public_dump/atp_pipeline_handoff/flashscore_data/, data/raw/public_dump/atp_pipeline_handoff/flashscore_bruteforce/]
    staged: null
    adapter: src/ingest/public_dump/atp_pipeline_handoff.py
    evidence: data/studies/atp_pipeline_handoff/
    report: docs/studies/atp_pipeline_handoff/README.md
    decision: docs/decisions/2026-09-25-atp-pipeline-handoff.md
    rights: No licence stated; Flashscore's terms forbid extraction
    notes: >-
      Not linked into the map's match counts: 127 GB of JSON is not read here. Its matches overlap the
      result files; its statistics would raise the stats share of Challenger and ITF matches somewhat.

  - id: atp_scraped_enriched
    name: ATP-site results with per-set statistics (Hugging Face handoff)
    provider: atptour.com, as scraped by the atlas-polybot pipeline
    what: >-
      ATP results with per-set statistics, return rating, both players' season-to-date statistics at
      match time, prize money and draw sizes: main tour 1991-2024, qualifying and Challenger 2009-2024.
    grain: stats
    tours: [men]
    levels: [GS, FIN, T1000, T500, T250, TEAM, TQ, CH, CHQ]
    years: 1991-2024
    status: on_disk
    how: hugging_face
    measured_as: []
    raw: [data/raw/public_dump/atp_pipeline_handoff/atp_scraped_enriched/, data/raw/public_dump/atp_pipeline_handoff/atp_scraped/]
    staged: null
    adapter: src/ingest/public_dump/atp_pipeline_handoff.py
    evidence: data/studies/atp_pipeline_handoff/
    report: docs/studies/atp_pipeline_handoff/README.md
    decision: docs/decisions/2026-09-25-atp-pipeline-handoff.md
    rights: No licence stated
    notes: Not linked into the map's counts; the same matches already carry totals from Tennis My Life and Sackmann.

  - id: open_tennis_data
    name: Open Tennis Data
    provider: Open Tennis Data release data-v3-20260905T083014Z (GitHub)
    what: >-
      Completed main-tour results 2020 to 29 Aug 2026 with exact match dates, plus fixtures, players,
      tournaments and provenance. Built from tennis-data.co.uk and Sackmann.
    grain: result
    tours: [men, women]
    levels: [GS, FIN, T1000, T500, T250]
    years: 2020-2026 (to 29 Aug)
    status: on_disk
    how: github
    measured_as: []
    raw: [data/raw/public_dump/open_tennis_data/]
    staged: [data/dump/matches/open_tennis_data/, data/dump/players/open_tennis_data/]
    adapter: src/ingest/public_dump/open_tennis_data.py
    evidence: data/studies/public_data_dump/
    report: docs/studies/public_data_dump/README.md
    rights: See the release's own notes
    notes: A derivative of sources already held, so it adds exact dates, not matches.

  - id: wta_site_records
    name: WTA website match records (Kaggle copy)
    provider: >-
      Kaggle dataset bwandowando/womens-tennis-association-matches-1975-present (version 29, 24 Sep 2026), built from
      wtatennis.com player by player
    what: >-
      Every women's singles result the WTA website lists, 1975 to early September 2026, with scores and rounds:
      the WTA tours, WTA 125, ITF and qualifying, and their tournaments with start dates and levels. The only file
      on disk with women's ITF qualifying of 2025-26 and women's ITF results after June 2026.
    grain: result
    tours: [women]
    levels: [GS, GSQ, FIN, T1000, T500, T250, TQ, CH, CHQ, ITF, ITFQ]
    years: 1975 - early September 2026
    status: on_disk
    how: kaggle
    measured_as: [wta_site]
    raw: [data/raw/gap_sources/bwandowando/]
    staged: null
    adapter: src/eda/gap_sources/wta_site_kaggle.py
    evidence: data/studies/gap_sources/wta_site_kaggle.json
    report: docs/research/gap-sources/README.md
    decision: docs/decisions/2026-10-08-scraping-approved.md
    rights: Labelled Apache 2.0 on Kaggle; the records are the WTA's
    notes: >-
      Each match appears once per player, and 12% of the ITF rows again under a second pseudo id; the map keeps one
      per tournament, draw, round and pair, and leaves out byes, walkovers and unplayed matches. The same records
      can be refreshed from the WTA API's player-matches endpoint.

  - id: live_tennis_api
    name: Live Tennis API public sample
    provider: Live Tennis API, Zenodo record 22048731 v1.0.0
    what: >-
      A match index of 2023 to 13 Aug 2026 (schedule only, no winners), players with a partial
      Sackmann id crosswalk, and 951,064 timestamped score states for 5,380 matches of June 2026 at
      every level, ITF included.
    grain: point
    tours: [men, women]
    levels: [GS, T1000, T500, T250, TQ, CH, CHQ, ITF, ITFQ]
    years: June 2026 (points); 2023-2026 (index)
    status: on_disk
    how: zenodo
    measured_as: [lta_sample]
    raw: [data/raw/public_dump/live_tennis_api_zenodo/]
    staged: [data/dump/matches/live_tennis_api_zenodo/, data/dump/players/live_tennis_api_zenodo/, data/dump/points/live_tennis_api_zenodo/]
    adapter: src/ingest/public_dump/live_tennis_api_zenodo.py
    evidence: data/studies/public_data_dump/
    report: docs/studies/public_data_dump/README.md
    rights: CC BY-NC 4.0
    notes: The only point data for ITF matches outside the ten careers. The full archive is paid.

  # ---------------------------------------------------------------- point by point
  - id: slam_pbp_archive
    name: Sackmann's Grand Slam point-by-point
    provider: Jeff Sackmann's tennis_slam_pointbypoint (IBM and Infosys feeds), via the archival mirror
    what: >-
      Every point of Grand Slam main-draw singles, with server, winner, aces, double faults, serve
      number, serve speed and rally counts: Wimbledon and the US Open to 2024, the Australian Open and
      Roland Garros to 2021. Doubles and mixed for some years.
    grain: point
    tours: [men, women]
    levels: [GS]
    years: 2011-2024
    status: on_disk
    how: github
    measured_as: [slam_pbp]
    raw: [data/raw/public_dump/sackmann_archive/slam_pointbypoint/]
    staged: [data/dump/points/sackmann_archive/]
    adapter: src/ingest/public_dump/sackmann_archive.py
    evidence: data/studies/public_data_dump/
    report: docs/studies/public_data_dump/README.md
    rights: CC BY-NC-SA 4.0
    notes: No clock times. The 2018 US Open holds 178 of 254 matches.

  - id: wimbledon_feeds
    name: Wimbledon scoring feeds (IBM SlamTracker)
    provider: AELTC's public scoring JSON (2025.wimbledon.com archive host; www for 2026)
    what: >-
      All 4,228 matches of the six events of 2019 and 2021-2026 (men's and women's singles, qualifying
      and doubles): every point with clock time, serve number, speed and a sentence naming the stroke
      and outcome, plus match statistics, likelihood-to-win after each point (2025-26) and TennisViz
      metrics (2024-25).
    grain: point
    tours: [men, women]
    levels: [GS, GSQ]
    years: 2019, 2021-2026
    status: on_disk
    how: api_scrape
    measured_as: [wimbledon]
    raw: [data/raw/point_sources/wimbledon/]
    staged: [data/dump/points/wimbledon/]
    adapter: src/ingest/point_sources/wimbledon.py (engine slamtracker.py)
    evidence: data/studies/official_point_feeds/
    report: docs/studies/official_point_feeds/README.md
    decision: docs/decisions/2026-09-24-official-point-feeds.md
    rights: AELTC allows personal, non-commercial extracts; the archive host's robots.txt disallows robots
    backup: The archive host could be retired at any time; the raw folder is then the only copy of 2019-2025.

  - id: usopen_feeds
    name: US Open scoring feeds (IBM SlamTracker)
    provider: USTA's public scoring JSON (usopen.org)
    what: >-
      All 3,020 matches of the six events of 2022-2026, 2,445 with every point (clock time, stroke and
      outcome sentence, serve speed, placement), plus match statistics, distance run, likelihood-to-win
      (2025-26), pre-match likelihood, and 2026 serve limb tracking and key moments.
    grain: point
    tours: [men, women]
    levels: [GS, GSQ]
    years: 2022-2026
    status: on_disk
    how: api_scrape
    measured_as: [usopen]
    raw: [data/raw/point_sources/usopen/]
    staged: [data/dump/points/usopen/]
    adapter: src/ingest/point_sources/usopen.py (engine slamtracker.py)
    evidence: data/studies/official_point_feeds/
    report: docs/studies/official_point_feeds/README.md
    decision: docs/decisions/2026-09-24-official-point-feeds.md
    rights: USTA's terms forbid scraping; collected under the owner's decision
    backup: The raw folder would be the only copy if the site drops older years; back it up outside the working tree.
    notes: Qualifying before 2025 had full data only on courts with cameras (about 40%). The 2026 draw clock runs 5 hours early.

  - id: ausopen_match_centre
    name: Australian Open match centre
    provider: Tennis Australia's scores API (prod-scores-api.ausopen.com) and Wayback captures
    what: >-
      All 604 matches of the six 2026 events, 600 with every point (clock time, outcome, stroke side),
      with per-set statistics; plus 47 main-event matches of 2020-2025 from Wayback captures and the
      archived draws of 2019-2025.
    grain: point
    tours: [men, women]
    levels: [GS, GSQ]
    years: 2026 (2020-2025 captures)
    status: on_disk
    how: api_scrape
    measured_as: [ausopen, ausopen_wayback, slam_draws]
    raw: [data/raw/point_sources/ausopen/]
    staged: [data/dump/points/ausopen/]
    adapter: src/ingest/point_sources/ausopen.py
    evidence: data/studies/official_point_feeds/
    report: docs/studies/official_point_feeds/README.md
    decision: docs/decisions/2026-09-24-official-point-feeds.md
    rights: Tennis Australia forbids automated collection; collected under the owner's decision
    backup: The API serves only the current edition; the raw folder is the only copy once 2027 starts.

  - id: wta_api
    name: WTA official API
    provider: api.wtatennis.com (public JSON, no login)
    what: >-
      Match lists of every WTA 1000, 500, 250, 125 and Finals edition (and the Slams from 2024), and per
      match the chair umpire's point log (server, first or second serve, aces, double faults, a millisecond
      clock time), the box score, advanced statistics, point-by-point and win probability. Collected in
      batches B1-B9, all finished by 2 Oct 2026.
    grain: point
    tours: [women]
    levels: [GS, GSQ, FIN, T1000, T500, T250, TQ, CH, CHQ]
    years: 2019-2026 (point log from 1 Apr 2019)
    status: on_disk
    how: api_scrape
    measured_as:
