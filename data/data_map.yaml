    decision: docs/decisions/2026-10-07-serve-speed-acquisition.md
    rights: >-
      MIT label on the repository, no data licence; the numbers are the ATP's, and atptour.com's terms
      forbid systematic retrieval
    notes: >-
      Equal to the decrypted ATP key statistics on every match checked (5,847 of 2021-24 against the
      Hugging Face handoff, 333 player-matches of 2025 against SirGenkii). Re-pull weekly with --commit
      latest: a 2025 match's speed can arrive weeks late. No match date; the study links rows to Stage 0 by
      names, tournament start date and round.

  # ---------------------------------------------------------------- market data
  - id: polymarket
    name: Polymarket tennis markets and prices
    provider: Polymarket's public Gamma and CLOB APIs
    what: >-
      Every tennis event and contract listed from 10 Sep 2025 to 7 Oct 2026, and minute-by-minute
      prices of every match-winner market whose match day had passed by 5 Oct 2026 (40,292 markets,
      69.3 million price rows), grouped by an inferred tournament level. Events captured while their
      matches were still to be played are fetched again for their results (polymarket_catalog.py
      --revisit), and price histories fetched before their market closed are fetched again.
    grain: market
    tours: [men, women]
    levels: [GS, GSQ, FIN, T1000, T500, T250, TEAM, TQ, CH, ITF]
    years: September 2025 - October 2026
    status: on_disk
    how: public_api
    measured_as: []
    raw: [data/raw/public_dump/polymarket_catalog/, data/raw/public_dump/polymarket_prices/]
    staged: [data/dump/odds/polymarket/]
    adapter: src/ingest/public_dump/polymarket_catalog.py, src/ingest/public_dump/polymarket_prices.py (every odds source at once with src/ingest/refresh_odds.py)
    evidence: data/studies/tennis_data_audit/polymarket/
    report: docs/research/tennis-data-audit/polymarket-census.md
    rights: Polymarket's API terms
    notes: >-
      Prices are for the first outcome of each match-winner market only; set, total and handicap
      contracts are listed but their prices were not fetched. ITF and doubles markets start in May 2026.

  - id: polymarket_trades
    name: Polymarket tennis trades, both sides, with wallets
    provider: Polymarket's public Data API (trades endpoint, takerOnly=false)
    what: >-
      Every fill in the tennis match-winner markets whose match was on or before 5 Oct 2026 (40,171
      markets requested): the taker's record and each matched maker order, with wallet address, side,
      outcome, shares, price and time (38.1 million records; 36.0 million downloaded 25 Sep 2026, the
      rest on 5 Oct 2026). A market fetched before it closed is fetched again on the next run.
    grain: market
    tours: [men, women]
    levels: [GS, GSQ, FIN, T1000, T500, T250, TEAM, TQ, CH, ITF]
    years: September 2025 - October 2026
    status: on_disk
    how: public_api
    measured_as: []
    raw: [data/raw/public_dump/polymarket_trades/]
    staged: [data/dump/odds/polymarket/trades/]
    adapter: src/ingest/public_dump/polymarket_trades.py
    evidence: data/studies/polymarket_sharp_money/
    report: docs/studies/polymarket_sharp_money/README.md
    rights: Polymarket's API terms
    notes: >-
      The taker is the first record of each transaction (checked against takerOnly=true). Fees are not in
      the records: fees taken in shares show as a taker BUY smaller than its makers' orders, and cash fees
      (from 28 Apr 2026) have to be modelled; see the sharp-money study.

  - id: polymarket_books_pmxt
    name: Polymarket tennis order books, four days (PMXT archive)
    provider: PMXT's public archive of Polymarket's CLOB WebSocket market channel (r2v2.pmxt.dev, hourly Parquet)
    what: >-
